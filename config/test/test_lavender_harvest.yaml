/*/test_lavender_harvest:
  ros__parameters:

    # ── Dock instances ────────────────────────────────────────────────────────
    docks:
      names: [husky_charger, unloading_station]
      husky_charger:
        type:  simple_charging_dock
        frame: map
        pose:  [0.8, -1.945, 0.0]      # [x, y, theta_rad]
      unloading_station:
        type:  simple_charging_dock
        frame: map
        pose:  [0.85, 1.60, 1.571]

    # ── Plugin (staging offsets) ──────────────────────────────────────────────
    plugin:
      name:               simple_charging_dock
      staging_x_offset:  -1.5
      staging_yaw_offset: 0.0

    # ── Controller (reverse drive motion params) ──────────────────────────────
    controller:
      base_frame:           base_link
      controller_frequency: 50.0
      v_linear_min:         0.15
      v_linear_max:         0.15
      v_angular_max:        0.25

    # ── Undocking tolerances ──────────────────────────────────────────────────
    undocking:
      linear_tolerance:  0.05
      angular_tolerance: 0.1
      dock_backwards:    false

    # ── DriveClient (camera-guided row traversal) ─────────────────────────────
    drive:
      detection_topic:       manipulators/arm_0_detection/image_annotated/detection_pose
      odom_topic:            platform/odom
      base_frame:            base_link
      cmd_vel_rate:          10.0
      v_linear_min:          0.05
      v_linear_max:          0.2
      v_angular_max:         0.5
      k_rho:                 1.0
      ex_tolerance:          0.05
      stop_lookahead:        0.05
      ex_coast_gate:         0.1
      ex_angular_gate:       0.05
      departure_clearance:   0.3
      no_detection_distance: 0.5

    # ── Navigation ────────────────────────────────────────────────────────────
    navigation:
      max_retries: 3
      retry_delay: 5.0

    # ── Docking ───────────────────────────────────────────────────────────────
    docking:
      max_retries: 2
      retry_delay: 3.0
      threshold:   0.25

    # ── Battery ───────────────────────────────────────────────────────────────
    battery:
      low_threshold:  50.0
      full_threshold: 99.0

    # ── Loading ───────────────────────────────────────────────────────────────
    loading:
      increment: 20.0

    # ── Unloading ─────────────────────────────────────────────────────────────
    unloading:
      home_delay_s: 2.0   # delay between AT_END result and sending HOME goal

    # ── Timing ────────────────────────────────────────────────────────────────
    timing:
      timer_period:                 1.0
      initial_position_check_delay: 2.0

    # ── Task generation ───────────────────────────────────────────────────────
    task:
      trigger_topic: job/trigger    # topic name for server-side task generation

    # ── Subscription topics (relative to robot namespace) ─────────────────────
    topics:
      battery:   platform/bms/state
      pose:      ground_truth/pose
      imu:       sensors/gps_0/imu
      estop:     platform/emergency_stop
      task:      status/task
      detection: manipulators/arm_0_detection/image_annotated/detection_pose
