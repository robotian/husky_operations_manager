/*/husky_operations_manager:
  ros__parameters:
    # Navigation settings
    navigation:
      max_retries: 3
      retry_delay: 5.0  # seconds

    # Docking settings
    docking:
      max_retries: 2
      retry_delay: 3.0  # seconds
      threshold: 0.25  # meters - distance to consider "at dock"

    # Undocking settings
    undocking:
      max_retries: 2
      retry_delay: 3.0  # seconds
      staging_threshold: 0.05  # meters - staging area crossing threshold

    # Battery settings
    battery:
      low_threshold: 50.0  # percent
      full_threshold: 99.0  # percent

    # Loading settings
    loading:
      increment: 20.0  # percent per load operation

    # Timing
    timing:
      timer_period: 1.0  # seconds - main loop frequency
      initial_position_check_delay: 2.0  # seconds

    # Server timeout
    server:
      action_server_timeout: 5.0  # seconds

    # Motion / dock configuration.
    # FALLBACK ONLY. The launch file translates the Nav2 docking_server block
    # from nav2.yaml into these motion.* params and applies it AFTER this file,
    # so nav2.yaml wins for every key it provides. The values below are used
    # only when nav2.yaml is missing or a key is absent from it.
    # dock_for_charging / dock_for_unloading are NOT in nav2.yaml and are always
    # taken from here.
    motion:
      dock_names: ['husky_charger', 'unloading_station']
      dock_configs:
        husky_charger:
          type: 'simple_charging_dock'
          frame: 'map'
          pose: [0.0, 0.0, 0.0]           # x, y, theta — overridden by nav2.yaml
        unloading_station:
          type: 'simple_charging_dock'
          frame: 'map'
          pose: [0.0, 0.0, 0.0]           # x, y, theta — overridden by nav2.yaml
      # task_type -> dock name (owned here, not in nav2.yaml)
      dock_for_charging: 'husky_charger'
      dock_for_unloading: 'unloading_station'
      # staging pose offsets (shared by all docks)
      staging_x_offset: -1.5
      staging_yaw_offset: 0.0
      base_frame: 'base_link'
      controller_frequency: 50.0
      v_linear_min: 0.15
      v_angular_max: 0.25
      linear_tolerance: 0.05
      angular_tolerance: 0.1
      dock_backwards: false

/*/reverse_navigation_node:
  ros__parameters:
  
    # ── Goal position ────────────────────────────────────────────────────────
    goal_x: 0.5           # Target x coordinate in fixed_frame (m)
    goal_y: 1.9           # Target y coordinate in fixed_frame (m)
    goal_yaw: 1.571       # Goal yaw angle     (rad)
 
    # ── Staging pose offsets (mirrors SimpleChargingDock) ────────────────────
    staging_x_offset:   -1.5   # Offset along dock yaw direction (m, negative = behind dock)
    staging_yaw_offset:  0.0   # Additional yaw applied to staging orientation (rad)
 
    # ── TF Frames ────────────────────────────────────────────────────────────
    fixed_frame: "map"        # Fixed reference frame
    base_frame:  "base_link"  # Robot base frame
 
    # ── Speed ────────────────────────────────────────────────────────────────
    linear_speed:  0.15   # Reverse drive speed      (m/s — always applied as -v)
    angular_speed: 0.30   # Max heading correction   (rad/s)
 
    # ── Tolerances (mirrors getCommandToPose linear_tolerance / angular_tolerance) ──
    linear_tolerance:  0.05   # Distance threshold to declare goal reached (m)
    angular_tolerance: 0.1   # Yaw threshold to declare goal reached      (rad)
 
    # ── Timeout ──────────────────────────────────────────────────────────────
    timeout: 30.0             # Hard stop if goal not reached within N seconds (s)
 
    # ── Topics ───────────────────────────────────────────────────────────────
    cmd_vel_topic: "cmd_vel"  # Relative to the robot namespace
 
    # ── Control ──────────────────────────────────────────────────────────────
    control_frequency: 20.0   # Control loop rate (Hz)
