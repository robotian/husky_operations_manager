/*/test_drive_node:
  ros__parameters:
    image_detection_topic: "sensors/camera_1/detection/image_annotated/detection_pose"
    base_frame: "base_link"
    tf_polling_rate: 10.0 # TF alignment check rate (Hz)
    tf_base_frame: "arm_0_base_link"
    tf_detection_frame: "camera_1_detections"
    tolerance: 0.05 # X axis alignment tolerance (m)
    timeout: 30.0 # Max correction time before warning (s)
    v_linear: 0.1 # Forward/reverse speed (m/s) — tune per terrain
    v_angular: 0.1 # Angular speed (rad/s)