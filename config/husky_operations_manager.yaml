/*/husky_operations_manager:
  ros__parameters:
    # Navigation settings
    navigation:
      max_retries: 3
      retry_delay: 5.0  # seconds

    # Docking settings
    docking:
      max_retries: 2
      retry_delay: 3.0  # seconds
      threshold: 0.25  # meters - distance to consider "at dock"

    # ── Dock instances ────────────────────────────────────────────────────────
    docks:
      names: [husky_charger, unloading_station]
      husky_charger:
        type:  simple_charging_dock
        frame: map
        pose:  [0.8, -1.945, 0.0]      # [x, y, theta_rad]
      unloading_station:
        type:  simple_charging_dock
        frame: map
        pose:  [0.85, 1.60, 1.571]

    # ── Plugin (staging offsets) ──────────────────────────────────────────────
    plugin:
      name: simple_charging_dock
      staging_x_offset:  -1.5
      staging_yaw_offset: 0.0

    # ── Controller (reverse drive motion params) ──────────────────────────────
    controller:
      base_frame:              base_link
      controller_frequency:    50.0
      v_linear_min:            0.15
      v_linear_max:            0.15
      v_angular_max:           0.25

    # ── Undocking tolerances ──────────────────────────────────────────────────
    undocking:
      linear_tolerance:  0.05
      angular_tolerance: 0.1
      dock_backwards:    false

    # Battery settings
    battery:
      low_threshold: 50.0  # percent
      full_threshold: 99.0  # percent

    # Loading settings
    loading:
      increment: 20.0  # percent per load operation

    # Timing
    timing:
      timer_period: 1.0  # seconds - main loop frequency
      initial_position_check_delay: 2.0  # seconds

    # Server timeout
    server:
      action_server_timeout: 5.0  # seconds
